[project]
name = "talk-engine"
version = "0.1.0"
description = "Conversation engine for Talk: keeps the character at the learner's level and rescues them when they get lost."
readme = "README.md"
authors = [
    { name = "Quamdeen Olajide" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Decision record 3: Ruff for linting and formatting.
# Rules: Ruff's defaults (E4, E7, E9, F) + flake8-bugbear (B) + isort (I).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

# Decision record 3: pyright in strict mode. The CAMeL Tools adapter
# (added in step 5) will be the only module where strict is relaxed.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
